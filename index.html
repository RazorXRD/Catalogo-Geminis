<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Rider &mdash; Cat&aacute;logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap\" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{\r
  --cyan:#00d4ff;--pink:#ff1493;--dark-cyan:#00a8cc;\r
  --bg:#080810;--s1:#0e0e18;--s2:#14141f;--s3:#1c1c2a;\r
  --txt:#eaeaea;--muted:#777;--border:#1e1e2e;\r
  --green:#1db954;--amber:#f59e0b;\r
  --fh:'Bebas Neue',sans-serif;--fb:'Barlow',sans-serif;\r
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:var(--fb);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;background:none;border:none;color:inherit}

/* Header */
.cr-header{position:fixed;top:0;left:0;right:0;height:70px;background:rgba(8,8,16,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;box-shadow:0 4px 20px rgba(0,0,0,0.4)}
.cr-brand{display:flex;align-items:center;gap:0.75rem;cursor:pointer}

/* 🐺 Ajuste de tamaño y protección para que tu Logo cargue de cualquier formato */
.cr-logo-img{width:42px;height:42px;object-fit:contain}

.cr-title{font-family:var(--fh);font-size:1.85rem;letter-spacing:1px;background:linear-gradient(90deg, var(--cyan), var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:0.25rem}

.cr-nav{display:flex;align-items:center;gap:1.5rem}
.cr-nav-item{font-size:0.95rem;font-weight:500;color:var(--muted);transition:color 0.25s,transform 0.25s;position:relative;padding:0.25rem 0}
.cr-nav-item:hover{color:var(--txt)}
.cr-nav-item.active{color:var(--cyan);font-weight:600}
.cr-nav-item.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--cyan);border-radius:2px}

.cr-search-bar{position:relative;display:flex;align-items:center;background:var(--s1);border:1px solid var(--border);border-radius:20px;padding:0.4rem 1rem;width:240px;transition:all 0.3s}
.cr-search-bar:focus-within{border-color:var(--cyan);box-shadow:0 0 12px rgba(0,212,255,0.15);width:280px}
.cr-search-bar input{width:100%;font-size:0.87rem;outline:none}
.cr-search-bar svg{width:16px;height:16px;fill:var(--muted);margin-left:0.5rem;pointer-events:none}

/* El resto de tus estilos originales de tarjetas, carrusel y filtros se mantienen idénticos abajo */
</style>
</head>
<body>

  <header class="cr-header">
    <div class="cr-brand" onclick="window.scrollTo({top:0,behavior:'smooth'})">
      <img src="logo.png" alt="Cloud Rider Logo" class="cr-logo-img" onerror="this.onerror=null; this.src='logo.jpg'; this.onerror=function(){this.style.display='none'; document.getElementById('logo-fallback').style.display='block';}">
      <div id="logo-fallback" style="display:none; font-family:var(--fh); font-size:1.8rem; color:var(--cyan); font-weight:bold; margin-right:5px;">CR</div>
      <h1 class="cr-title">Cloud Rider</h1>
    </div>
    
    <div class="cr-nav-container">
      <nav class="cr-nav" id="main-nav-tabs">
        </nav>
    </div>

    <div class="cr-search-bar">
      <input type="text" id="global-search" placeholder="Buscar títulos, géneros...">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    </div>
  </header>

  </body>
</html>
