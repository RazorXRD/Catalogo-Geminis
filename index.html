<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Online Global</title>
    <style>
        /* Estilos Base - Modo Oscuro Premium */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #141414;
            color: #ffffff;
            padding-bottom: 50px;
        }

        header {
            background-color: #000000;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid #e50914;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #e50914;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .logo span { color: #ffffff; }

        .catalog-tabs {
            display: flex;
            list-style: none;
            gap: 10px;
            overflow-x: auto;
            white-space: nowrap;
            padding: 5px 0;
        }

        .catalog-tabs::-webkit-scrollbar { height: 4px; }
        .catalog-tabs::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

        .catalog-tabs button {
            background-color: #222;
            border: 1px solid #444;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .catalog-tabs button:hover, .catalog-tabs button.active {
            background-color: #e50914;
            border-color: #e50914;
            color: #ffffff;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .section-title {
            font-size: 22px;
            border-left: 4px solid #e50914;
            padding-left: 10px;
            text-transform: uppercase;
        }

        .search-box {
            display: flex;
            align-items: center;
            background-color: #222;
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 4px;
        }

        .search-box input {
            background: none;
            border: none;
            color: white;
            outline: none;
            padding: 3px;
            font-size: 14px;
            width: 220px;
        }

        .series-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .series-card {
            background-color: #1f1f1f;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .series-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .thumbnail-container {
            position: relative;
            width: 100%;
            padding-top: 140%;
            background-color: #2a2a2a;
        }

        .thumbnail-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-imdb {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #f5c518;
            color: #000000;
            padding: 3px 6px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 3px;
        }

        .badge-info {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 3px 6px;
            font-size: 11px;
            font-weight: 500;
            border-radius: 3px;
            border: 1px solid #444;
        }

        .series-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .series-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 5px;
        }

        .series-meta {
            font-size: 12px;
            color: #aaaaaa;
            margin-top: auto;
        }

        .status-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px;
            color: #888;
            font-size: 16px;
        }

        footer {
            text-align: center;
            padding: 30px;
            background-color: #0b0b0b;
            margin-top: 50px;
            border-top: 1px solid #222;
            color: #666;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .navbar { flex-direction: column; }
            .catalog-tabs { width: 100%; justify-content: flex-start; }
            .section-header { flex-direction: column; align-items: flex-start; }
            .search-box { width: 100%; }
            .search-box input { width: 100%; }
            .series-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="navbar">
            <div class="logo">GatonPlay<span>Catálogo</span></div>
            <nav>
                <div class="catalog-tabs" id="catalog-tabs">
                    <button class="active" onclick="cambiarCatalogo('series.csv')">Series</button>
                    <button onclick="cambiarCatalogo('animes.csv')">Anime</button>
                    <button onclick="cambiarCatalogo('doramas.csv')">Dorama</button>
                    <button onclick="cambiarCatalogo('novelas.csv')">Novelas</button>
                    <button onclick="cambiarCatalogo('juegos.csv')">Juegos PC</button>
                    <button onclick="cambiarCatalogo('peliculas.csv')">Películas</button>
                    <button onclick="cambiarCatalogo('animados.csv')">Animados</button>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="section-header">
            <h2 class="section-title" id="catalog-title">Cargando...</h2>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Buscar por título...">
            </div>
        </div>

        <div class="series-grid" id="grid-container">
            <div class="status-message">Iniciando...</div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Catálogo de Medios Global en Vercel</p>
    </footer>

    <script>
        let datosActuales = [];
        let archivoActual = 'series.csv';

        document.addEventListener("DOMContentLoaded", () => {
            cambiarCatalogo('series.csv');
            document.getElementById('search-input').addEventListener('input', filtrarContenido);
        });

        function cambiarCatalogo(nombreArchivo) {
            archivoActual = nombreArchivo;
            
            document.querySelectorAll('.catalog-tabs button').forEach(btn => {
                btn.classList.remove('active');
                if(btn.getAttribute('onclick').includes(nombreArchivo)) {
                    btn.classList.add('active');
                    document.getElementById('catalog-title').innerText = btn.innerText;
                }
            });

            const container = document.getElementById('grid-container');
            container.innerHTML = '<div class="status-message">Buscando base de datos multimedia...</div>';

            fetch(nombreArchivo)
                .then(response => {
                    if (!response.ok) throw new Error("No se pudo cargar " + nombreArchivo);
                    return response.text();
                })
                .then(texto => {
                    procesarCSV(texto);
                })
                .catch(error => {
                    container.innerHTML = `<div class="status-message" style="color: #e50914;">Asegúrate de que el nombre del archivo en GitHub sea exactamente "${nombreArchivo}" en minúsculas.</div>`;
                    console.error(error);
                });
        }

        function procesarCSV(texto) {
            const lineas = texto.split(/\r?\n/);
            if (lineas.length < 2) return;

            // Mapeo flexible de cabeceras
            const cabeceras = lineas[0].split(';').map(c => c.trim().toLowerCase());
            datosActuales = [];

            for (let i = 1; i < lineas.length; i++) {
                if (!lineas[i].trim()) continue;
                
                const columnas = lineas[i].split(';');
                const obj = {};
                
                cabeceras.forEach((cabecera, index) => {
                    obj[cabecera] = columnas[index] ? columnas[index].trim() : '';
                });

                // Extracción inteligente tolerante a variaciones de columnas
                const tituloFinal = obj.titulo_encontrado || obj.titulo || obj.titulo_original || "Sin título";
                const anioFinal = obj.anio || obj.anio_lanzamiento || "N/A";
                const imagenFinal = obj.link_imagen || obj.poster_url || "";
                const scoreFinal = obj.puntuacion_imdb || obj.puntuacion || obj.puntuacion_tmdb || obj.puntuacion_usuario || "N/A";
                const tempFinal = obj.temporadas || "1";
                const capFinal = obj.capitulos || obj.episodios || "0";

                datosActuales.push({
                    titulo: tituloFinal,
                    anio: anioFinal,
                    imagen: imagenFinal,
                    imdb: scoreFinal,
                    temporadas: tempFinal,
                    capitulos: capFinal
                });
            }

            filtrarContenido();
        }

        function filtrarContenido() {
            const busqueda = document.getElementById('search-input').value.toLowerCase();
            const filtrados = datosActuales.filter(item => 
                item.titulo.toLowerCase().includes(busqueda)
            );
            renderizarGrid(filtrados);
        }

        function renderizarGrid(lista) {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';

            if (lista.length === 0) {
                container.innerHTML = `<div class="status-message">No se encontraron resultados en esta sección.</div>`;
                return;
            }

            lista.forEach(item => {
                const tarjeta = document.createElement('div');
                tarjeta.className = 'series-card';
                
                const esJuego = archivoActual === 'juegos.csv';
                const esPeli = archivoActual === 'peliculas.csv';
                
                let infoBadge = `T${item.temporadas} • C${item.capitulos}`;
                if (esJuego || esPeli) {
                    infoBadge = `Año: ${item.anio.split(' ')[0]}`; // Solo el primer año limpio
                }

                const ratingBadge = (item.imdb !== 'N/A' && item.imdb !== '0.0' && item.imdb !== '0') ? `<span class="badge-imdb">⭐ ${item.imdb}</span>` : '';

                tarjeta.innerHTML = `
                    <div class="thumbnail-container">
                        ${ratingBadge}
                        <span class="badge-info">${infoBadge}</span>
                        <img src="${item.imagen}" alt="${item.titulo}" onerror="this.src='https://via.placeholder.com/250x350/222/fff?text=Sin+Imagen'">
                    </div>
                    <div class="series-info">
                        <div class="series-title" title="${item.titulo}">${item.titulo}</div>
                        <div class="series-meta">${item.anio}</div>
                    </div>
                `;
                container.appendChild(tarjeta);
            });
        }
    </script>
</body>
</html>
