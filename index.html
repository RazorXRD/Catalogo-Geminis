<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GatonPlay Series - Catálogo Completo</title>
    <style>
        /* Estilos Generales y Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #141414;
            color: #ffffff;
            padding-bottom: 50px;
        }

        /* Barra de Navegación */
        header {
            background-color: #000000;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid #e50914;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #e50914;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .logo span {
            color: #ffffff;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 15px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 5px;
            max-width: 60%;
        }

        .nav-menu::-webkit-scrollbar {
            height: 4px;
        }
        .nav-menu::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 2px;
        }

        .nav-menu li button {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.3s;
            cursor: pointer;
            padding: 5px 10px;
        }

        .nav-menu li button:hover, .nav-menu li button.active {
            color: #e50914;
        }

        /* Zona de carga del archivo CSV */
        .upload-zone {
            max-width: 1200px;
            margin: 20px auto 0 auto;
            padding: 15px 20px;
            background-color: #1f1f1f;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid #333;
        }

        .btn-upload {
            background-color: #e50914;
            color: #fff;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-upload:hover {
            background-color: #b80710;
        }

        #csv-file {
            display: none;
        }

        /* Contenedor Principal */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .section-title {
            font-size: 22px;
            border-left: 4px solid #e50914;
            padding-left: 10px;
            text-transform: uppercase;
        }

        .search-box {
            display: flex;
            align-items: center;
            background-color: #222;
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 4px;
        }

        .search-box input {
            background: none;
            border: none;
            color: white;
            outline: none;
            padding: 3px;
            font-size: 14px;
            width: 220px;
        }

        /* Grid de Series */
        .series-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .series-card {
            background-color: #1f1f1f;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .series-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .thumbnail-container {
            position: relative;
            width: 100%;
            padding-top: 140%;
            background-color: #2a2a2a;
        }

        .thumbnail-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-imdb {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #f5c518;
            color: #000000;
            padding: 3px 6px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 3px;
        }

        .badge-info {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 3px 6px;
            font-size: 11px;
            font-weight: 500;
            border-radius: 3px;
            border: 1px solid #444;
        }

        .series-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .series-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 5px;
        }

        .series-meta {
            font-size: 12px;
            color: #aaaaaa;
            margin-top: auto;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px;
            color: #888;
            font-size: 16px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px;
            background-color: #0b0b0b;
            margin-top: 50px;
            border-top: 1px solid #222;
            color: #666;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }
            .nav-menu {
                max-width: 100%;
                width: 100%;
                justify-content: flex-start;
            }
            .section-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .search-box {
                width: 100%;
            }
            .search-box input {
                width: 100%;
            }
            .series-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="navbar">
            <div class="logo" id="logo-btn">GatonPlay<span>Series</span></div>
            <nav>
                <ul class="nav-menu" id="menu-generos">
                    <li><button class="active">Todos</button></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="upload-zone">
        <div>
            <strong>Estado del catálogo:</strong> <span id="db-status" style="color: #e50914;">Por favor, selecciona tu archivo series.csv</span>
        </div>
        <div>
            <label for="csv-file" class="btn-upload">Seleccionar series.csv</label>
            <input type="file" id="csv-file" accept=".csv">
        </div>
    </div>

    <main class="container">
        <div class="section-header">
            <h2 class="section-title" id="current-category-title">Todos los contenidos</h2>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Buscar por título...">
            </div>
        </div>

        <div class="series-grid" id="grid-container">
            <div class="no-results">Usa el botón de arriba para cargar todas tus series al instante.</div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 GatonPlay Series - Catálogo Automático Completo</p>
    </footer>

    <script>
        let datosSeries = [];
        let generoActual = 'Todos';

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('csv-file').addEventListener('change', cargarArchivoCSV);
            document.getElementById('search-input').addEventListener('input', filtrarYMostrar);
            document.getElementById('logo-btn').addEventListener('click', () => cambiarGenero('Todos'));
        });

        // Lee el archivo .csv completo que selecciones
        function cargarArchivoCSV(evt) {
            const archivo = evt.target.files[0];
            if (!archivo) return;

            const lector = new FileReader();
            lector.onload = function(e) {
                const texto = e.target.result;
                procesarTextoCSV(texto);
            };
            lector.readAsText(archivo, 'UTF-8');
        }

        // Convierte cada fila del CSV en una tarjeta interactiva
        function procesarTextoCSV(texto) {
            const lineas = texto.split(/\r?\n/);
            if (lineas.length < 2) return;

            // Leer cabeceras y detectar las columnas (separadas por punto y coma ';')
            const cabeceras = lineas[0].split(';').map(c => c.trim().toLowerCase());
            datosSeries = [];

            for (let i = 1; i < lineas.length; i++) {
                if (!lineas[i].trim()) continue;
                
                const columnas = lineas[i].split(';');
                const obj = {};
                
                cabeceras.forEach((cabecera, index) => {
                    obj[cabecera] = columnas[index] ? columnas[index].trim() : '';
                });

                datosSeries.push({
                    titulo: obj.titulo || "Sin título",
                    anio: obj.anio || "N/A",
                    sinopsis: obj.sinopsis || "",
                    imagen: obj.link_imagen || "",
                    generos: obj.generos || "Otros",
                    imdb: obj.puntuacion_imdb || "N/A",
                    temporadas: obj.temporadas || "1",
                    capitulos: obj.capitulos || "0"
                });
            }

            document.getElementById('db-status').innerText = `¡Éxito! ${datosSeries.length} títulos cargados.`;
            document.getElementById('db-status').style.color = "#2ecc71";

            generarMenuGeneros();
            cambiarGenero('Todos');
        }

        // Genera los botones del menú superior basándose en tu archivo
        function generarMenuGeneros() {
            const menu = document.getElementById('menu-generos');
            const listaGeneros = new Set(['Todos']);

            datosSeries.forEach(serie => {
                if (serie.generos) {
                    serie.generos.split(',').forEach(g => listaGeneros.add(g.trim()));
                }
            });

            menu.innerHTML = '';
            listaGeneros.forEach(genero => {
                const li = document.createElement('li');
                const boton = document.createElement('button');
                boton.innerText = genero;
                boton.id = `btn-${genero.replace(/\s+/g, '')}`;
                if (genero === 'Todos') boton.className = 'active';
                
                boton.addEventListener('click', () => cambiarGenero(genero));
                li.appendChild(boton);
                menu.appendChild(li);
            });
        }

        function cambiarGenero(genero) {
            generoActual = genero;
            document.querySelectorAll('#menu-generos button').forEach(b => b.classList.remove('active'));
            const botonActivo = document.getElementById(`btn-${genero.replace(/\s+/g, '')}`);
            if (botonActivo) botonActivo.classList.add('active');

            filtrarYMostrar();
        }

        function filtrarYMostrar() {
            const busqueda = document.getElementById('search-input').value.toLowerCase();
            const tituloSeccion = document.getElementById('current-category-title');
            
            tituloSeccion.innerText = generoActual === 'Todos' ? 'Todos los contenidos' : `Género: ${generoActual}`;

            const filtrados = datosSeries.filter(serie => {
                const cumpleTexto = serie.titulo.toLowerCase().includes(busqueda);
                let cumpleGenero = (generoActual === 'Todos');
                
                if (!cumpleGenero && serie.generos) {
                    cumpleGenero = serie.generos.split(',').map(g => g.trim()).includes(generoActual);
                }
                return cumpleTexto && cumpleGenero;
            });

            renderizarGrid(filtrados);
        }

        function renderizarGrid(lista) {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';

            if (lista.length === 0) {
                container.innerHTML = `<div class="no-results">No se encontraron contenidos que coincidan.</div>`;
                return;
            }

            lista.forEach(serie => {
                const tarjeta = document.createElement('div');
                tarjeta.className = 'series-card';
                tarjeta.innerHTML = `
                    <div class="thumbnail-container">
                        <span class="badge-imdb">⭐ ${serie.imdb}</span>
                        <span class="badge-info">T${serie.temporadas} • C${serie.capitulos}</span>
                        <img src="${serie.imagen}" alt="${serie.titulo}" onerror="this.src='https://via.placeholder.com/250x350/222/fff?text=Sin+Imagen'">
                    </div>
                    <div class="series-info">
                        <div class="series-title" title="${serie.titulo}">${serie.titulo}</div>
                        <div class="series-meta">${serie.anio}</div>
                    </div>
                `;
                container.appendChild(tarjeta);
            });
        }
    </script>
</body>
</html>
